<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Gym Tracker</title>
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --text: #1b1f24; --muted: #6b7280; --line: #dfe3e8;
  --accent: #2563eb; --accent-text: #ffffff; --accent-soft: #dbe7ff;
  --due: #c62828; --due-soft: #fde8e7; --soon: #a35a00; --soon-soft: #fff1d1;
  --done-soft: #e3f5e8; --ok: #15803d;
  --tabh: 60px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1115; --card: #191c22; --text: #e8eaed; --muted: #9aa0a6; --line: #2e333b;
    --accent: #6ea8ff; --accent-text: #0b1220; --accent-soft: #1d2b45;
    --due: #ff7b72; --due-soft: #3b1e1e; --soon: #f2b33d; --soon-soft: #3a2c12;
    --done-soft: #16301f; --ok: #4ade80;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  overflow-x: hidden;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:disabled { cursor: default; opacity: .45; }

/* Header and tab bar */
header.top {
  position: sticky; top: 0; z-index: 10; background: var(--bg);
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: calc(8px + env(safe-area-inset-top)) 16px 8px; border-bottom: 1px solid var(--line);
}
header.top h1 { margin: 0; font-size: 18px; }
.sync {
  min-height: 36px; padding: 4px 12px; border-radius: 18px; border: 1px solid var(--line);
  background: var(--card); font-size: 13px; color: var(--muted); white-space: nowrap;
}
.sync.synced { color: var(--ok); }
.sync.unsynced { color: var(--soon); }
.sync.reconnect { color: var(--due); border-color: var(--due); }
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex;
  background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom);
}
nav.tabs button {
  flex: 1; height: var(--tabh); border: 0; background: none; color: var(--muted); font-size: 14px; font-weight: 600;
}
nav.tabs button.on { color: var(--accent); box-shadow: inset 0 3px 0 var(--accent); }

main { max-width: 640px; margin: 0 auto; padding: 12px 16px calc(var(--tabh) + 96px + env(safe-area-inset-bottom)); }
h2 { font-size: 15px; margin: 20px 0 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.headline { color: var(--muted); font-size: 14px; margin: 4px 0 8px; }
.hint { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin: 12px 0; }
.none { color: var(--muted); font-size: 14px; padding: 4px 2px; }
.count { font-size: 13px; color: var(--accent); font-weight: 600; }

/* Buttons */
.btn {
  min-height: 44px; padding: 8px 16px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--card); font-weight: 600;
}
.btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.btn.danger { color: var(--due); }
.btn.armed { background: var(--due); color: #fff; border-color: var(--due); }
.btn.block { display: block; width: 100%; margin: 8px 0; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > .btn { flex: 1; }
.actionbar {
  position: fixed; left: 0; right: 0; bottom: calc(var(--tabh) + env(safe-area-inset-bottom)); z-index: 9;
  padding: 10px 16px; background: linear-gradient(transparent, var(--bg) 30%);
}
.actionbar .inner { max-width: 608px; margin: 0 auto; display: flex; gap: 8px; }
.actionbar .btn { flex: 1; min-height: 50px; font-size: 17px; }
.actionbar .btn.secondary { flex: 0 0 auto; }

/* Plan rows */
.ex {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; margin: 0 0 6px;
  min-height: 56px; padding: 8px 12px; border-radius: 10px; background: var(--card);
  border: 1px solid var(--line); border-left: 5px solid var(--line);
}
.ex .check {
  flex: 0 0 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line);
  display: grid; place-items: center; font-size: 14px; color: var(--accent-text);
}
.ex.sel { background: var(--accent-soft); border-color: var(--accent); }
.ex.sel .check { background: var(--accent); border-color: var(--accent); }
.ex.sel .check::after { content: "✓"; }
.ex .body { flex: 1; min-width: 0; }
.ex .name { display: block; font-weight: 600; overflow-wrap: anywhere; }
.ex .meta { display: block; font-size: 13px; color: var(--muted); }
.ex.never .name { color: var(--muted); font-weight: 500; }
.ex.due { border-left-color: var(--due); }
.ex.due .since { color: var(--due); font-weight: 700; }
.ex.soon { border-left-color: var(--soon); }
.ex.soon .since { color: var(--soon); font-weight: 700; }
.badge { flex: 0 0 auto; font-size: 12px; font-weight: 700; text-transform: uppercase; padding: 2px 8px; border-radius: 10px; }
.due .badge { background: var(--due-soft); color: var(--due); }
.soon .badge { background: var(--soon-soft); color: var(--soon); }

/* Workout */
.wk-head { display: flex; align-items: center; gap: 8px; margin: 4px 0 12px; }
.wk-head input { min-height: 44px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin: 0 0 12px; }
.card-head { display: flex; align-items: flex-start; gap: 8px; }
.card-head h3 { flex: 1; min-width: 0; margin: 0; font-size: 17px; }
.fold { display: flex; align-items: center; width: 100%; min-height: 44px; padding: 0; border: 0; background: none; font-weight: 700; text-align: left; overflow-wrap: anywhere; }
.fold::before { content: "▾"; flex: 0 0 18px; color: var(--muted); }
.card.folded .fold::before { content: "▸"; }
.card.folded { padding-bottom: 8px; }
.sum { color: var(--muted); font-size: 14px; margin: 0 0 0 18px; overflow-wrap: anywhere; }
.sum b { color: var(--ok); }
.icon { flex: 0 0 44px; height: 44px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
.field {
  width: 100%; min-height: 40px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px;
  background: transparent; font-size: 15px;
}
textarea.field { resize: none; overflow: hidden; display: block; }
.last { color: var(--muted); font-size: 13px; margin: 6px 0 8px; }
.set { display: flex; align-items: center; gap: 6px; padding: 4px; margin: 0 -4px 2px; border-radius: 8px; }
.set.done { background: var(--done-soft); }
.set .n { flex: 0 0 16px; color: var(--muted); font-size: 13px; text-align: center; }
.set input {
  flex: 1; min-width: 0; height: 44px; padding: 0 8px; text-align: center; font-size: 17px;
  border: 1px solid var(--line); border-radius: 8px; background: var(--card);
}
.set input::placeholder { color: var(--muted); opacity: .7; }
.set .x { color: var(--muted); }
.set .tog { flex: 0 0 44px; height: 44px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); font-size: 18px; font-weight: 700; color: var(--muted); }
.set .tog.on { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.set .tog.ok.on { background: var(--ok); border-color: var(--ok); color: var(--accent-text); }
.set-btns { display: flex; gap: 8px; margin: 6px 0 8px; }
.set-btns .btn { flex: 1; min-height: 40px; font-weight: 500; }

/* Exercises */
.erow { display: flex; gap: 6px; margin: 0 0 6px; }
.erow .ename {
  flex: 1; min-width: 0; text-align: left; min-height: 48px; padding: 6px 12px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--card);
}
.erow .ename small { display: block; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.erow .icon { flex-basis: 44px; height: auto; min-height: 48px; }
details.arch { margin-top: 24px; }
details.arch summary { cursor: pointer; font-weight: 600; padding: 12px 0; }
.form label { display: block; font-weight: 600; font-size: 14px; margin: 14px 0 4px; }
.form .field { font-size: 16px; min-height: 44px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 40px; padding: 4px 14px; border-radius: 20px; border: 1px solid var(--line); background: var(--card); }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.err { color: var(--due); font-size: 14px; }
.small { font-size: 13px; color: var(--muted); }

/* History */
.hist-filter { width: 100%; min-height: 44px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); font-size: 15px; }
.hist h3 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin: 0 0 4px; font-size: 16px; }
.hist h3 .small { font-weight: 400; }
.hrow { padding: 8px 0 0; border-top: 1px solid var(--line); margin-top: 8px; }
.hrow .hname { padding: 0; border: 0; background: none; font-weight: 600; text-align: left; overflow-wrap: anywhere; }
.hrow .hsets { overflow-wrap: anywhere; }
.hrow .small { overflow-wrap: anywhere; }

/* Photos */
.exrow { display: flex; gap: 6px; margin: 0 0 6px; }
.exrow .ex { flex: 1; min-width: 0; margin: 0; }
.pic {
  flex: 0 0 56px; padding: 0; overflow: hidden; border-radius: 10px;
  border: 1px solid var(--line); background: var(--card); font-size: 20px;
}
.pic img, .photo-edit img { display: block; width: 100%; height: 100%; object-fit: cover; background: var(--line); }
.pic img.missing { visibility: hidden; }
.setting-row { display: flex; gap: 8px; }
.setting-row .pic { flex-basis: 44px; height: 40px; }
.photo-edit { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.photo-edit .preview { width: 96px; height: 96px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
#modal img.full { display: block; width: 100%; max-height: 70vh; object-fit: contain; border-radius: 8px; margin-bottom: 12px; }

/* Settings */
.kv { margin: 4px 0; font-size: 15px; overflow-wrap: anywhere; }
.kv span { color: var(--muted); }
.confirm { border: 1px solid var(--due); border-radius: 10px; padding: 12px; margin: 8px 0; }

/* Modal and toast */
#modal { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.5); display: grid; place-items: center; padding: 16px; }
#modal[hidden] { display: none; }
#modal .sheet { background: var(--card); border-radius: 14px; padding: 16px; max-width: 420px; width: 100%; }
#modal h2 { margin-top: 0; }
#toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabh) + 84px); z-index: 40;
  background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px;
  max-width: calc(100% - 32px); opacity: 0; pointer-events: none; transition: opacity .2s;
}
#toast.show { opacity: 1; }
</style>
</head>
<body>
<header class="top">
  <h1>Gym Tracker</h1>
  <button id="sync" class="sync" data-act="sync-tap">local only</button>
</header>
<main id="main"></main>
<nav class="tabs">
  <button data-act="tab" data-tab="plan" id="tab-plan">Plan</button>
  <button data-act="tab" data-tab="exercises">Exercises</button>
  <button data-act="tab" data-tab="history">History</button>
  <button data-act="tab" data-tab="settings">Settings</button>
</nav>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<input type="file" id="photoFile" accept="image/*" hidden>
<div id="modal" hidden><div class="sheet"></div></div>
<div id="toast" role="status"></div>
<script>
'use strict';
const GOOGLE_CLIENT_ID = '239433349999-cdptvbltd2saropujjum62m48tj5pcor.apps.googleusercontent.com';
const APP_VERSION = '1.4.2';

const GROUPS = [
  ['shoulders', 'Shoulders'], ['chest', 'Chest'], ['back', 'Back'], ['legs', 'Legs'],
  ['biceps', 'Biceps'], ['triceps', 'Triceps'], ['abs', 'Abs'],
];
const LS_DATA = 'gym.data', LS_DIRTY = 'gym.dirty', LS_FOLDED = 'gym.folded';

// ================= Helpers =================
const $ = s => document.querySelector(s);
const isObj = v => v !== null && typeof v === 'object' && !Array.isArray(v);
const arr = v => Array.isArray(v) ? v : [];
const str = v => typeof v === 'string' ? v : (v == null ? '' : String(v));
const esc = v => str(v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const validDate = v => typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v) ? v : null;

// Parses "12,5", "12.5", 12.5 → 12.5; empty or invalid → null.
function num(v) {
  if (typeof v === 'string') { v = v.trim().replace(',', '.'); if (!v) return null; }
  if (v === null || v === undefined || v === '' || typeof v === 'boolean') return null;
  const n = Number(v);
  return Number.isFinite(n) ? n : null;
}
const int = v => { const n = num(v); return n === null ? null : Math.round(n); };
const nonNegInt = v => { const n = int(v); return n === null || n < 0 ? null : n; };
const fmtNum = n => n == null ? '' : String(n);

function today() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
const fmtDate = iso => { const [y, m, d] = iso.split('-'); return `${d}.${m}.${y}`; };
const fmtShort = iso => { const [, m, d] = iso.split('-'); return `${d}.${m}.`; };
function daysAgo(iso) {
  const utc = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); };
  const n = Math.round((utc(today()) - utc(iso)) / 86400000);
  return n === 0 ? 'today' : n === 1 ? 'yesterday' : n < 0 ? 'in the future' : `${n} days ago`;
}
function slugify(name) {
  return name.normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase()
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'exercise';
}
function fmtSets(sets) {
  return sets.map(s => (s.weight != null ? `${fmtNum(s.weight)}×` : '') + (s.reps != null ? s.reps : '–') + (s.plus ? '+' : '')).join(' · ');
}

// ================= Data model =================
// Known keys come first in a fixed order; unknown fields from hand edits are kept after them.
function withExtras(known, src, skip = []) {
  if (isObj(src)) for (const k of Object.keys(src)) if (!(k in known) && !skip.includes(k)) known[k] = src[k];
  return known;
}

// Turns anything (hand-edited file, old local copy, nothing) into a valid data object.
function normalize(raw) {
  raw = isObj(raw) ? raw : {};
  const exercises = [], ids = new Set();
  for (const e of arr(raw.exercises)) {
    if (!isObj(e)) continue;
    const id = str(e.id).trim() || slugify(str(e.name));
    if (ids.has(id)) continue;
    ids.add(id);
    exercises.push(withExtras({
      id, name: str(e.name).trim() || id, setting: str(e.setting),
      maxSkip: nonNegInt(e.maxSkip), archived: e.archived === true, photo: str(e.photo).trim() || null,
    }, e));
  }
  const rawGroups = arr(raw.groups).filter(isObj);
  const groups = GROUPS.map(([id, name]) => {
    const g = rawGroups.find(x => x.id === id) || {};
    const list = [];
    for (const x of arr(g.exercises)) if (ids.has(x) && !list.includes(x)) list.push(x);
    return withExtras({ id, name, exercises: list }, g);
  });
  const rawSessions = arr(raw.sessions).filter(isObj);
  let openIdx = -1; // at most one in-progress session: the last one wins
  rawSessions.forEach((s, i) => { if (s.finished === false) openIdx = i; });
  const sessions = rawSessions.map((s, i) => {
    const finished = i !== openIdx, date = validDate(s.date) || today();
    return withExtras({
      id: str(s.id) || newSessionId(date), date, finished,
      items: arr(s.items).filter(it => isObj(it) && str(it.exercise)).map(it => withExtras({
        exercise: str(it.exercise), note: str(it.note),
        sets: arr(it.sets).filter(isObj).map(st => {
          const o = { weight: num(st.weight), reps: int(st.reps), plus: st.plus === true };
          if (!finished) o.done = st.done === true; // UI state, only while in progress
          return withExtras(o, st, ['done']);
        }),
      }, it)),
    }, s);
  });
  sortSessions(sessions);
  return withExtras({
    format: 'gym-tracker', version: 1, updatedAt: str(raw.updatedAt) || new Date().toISOString(),
    groups, exercises, sessions,
  }, raw);
}
const sortSessions = list => list.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0); // stable
const serialize = d => JSON.stringify(normalize(d), null, 2) + '\n';
const newSessionId = date => `${date}-${Math.random().toString(16).slice(2, 6)}`;

function loadLocal() {
  try { return normalize(JSON.parse(localStorage.getItem(LS_DATA))); } catch { return normalize({}); }
}

let data = loadLocal();
let changeSeq = 0;
const isDirty = () => localStorage.getItem(LS_DIRTY) === '1';
const setDirty = v => localStorage.setItem(LS_DIRTY, v ? '1' : '0');

// Call after every change to `data`: saves locally, marks dirty, schedules a push.
function commit({ render: doRender = true } = {}) {
  data.updatedAt = new Date().toISOString();
  localStorage.setItem(LS_DATA, serialize(data));
  changeSeq++;
  setDirty(true);
  Drive.schedulePush();
  doRender ? render() : renderChrome();
}
function replaceData(raw, dirty) {
  data = normalize(raw);
  localStorage.setItem(LS_DATA, serialize(data));
  changeSeq++;
  setDirty(dirty);
  render();
}

// ================= Derived values =================
const exById = id => data.exercises.find(e => e.id === id);
const groupById = id => data.groups.find(g => g.id === id);
const finishedSessions = () => data.sessions.filter(s => s.finished);
const current = () => data.sessions.find(s => !s.finished);

// exercise id → { since, item, date } from the most recent finished session containing it
function stats() {
  const fin = finishedSessions(), m = {};
  fin.forEach((s, i) => s.items.forEach(it => { m[it.exercise] = { since: fin.length - 1 - i, item: it, date: s.date }; }));
  return m;
}
function statusOf(ex, st) {
  if (!st) return 'never';
  if (ex.maxSkip == null) return 'ok';
  if (st.since >= ex.maxSkip) return 'due';
  if (st.since === ex.maxSkip - 1) return 'soon';
  return 'ok';
}
const sinceLabel = st => !st ? 'never' : st.since === 0 ? 'last session' : st.since === 1 ? '1 session ago' : `${st.since} sessions ago`;
const visibleIds = g => g.exercises.filter(id => { const e = exById(id); return e && !e.archived; });

function newItem(id, st) {
  const last = st[id], n = last && last.item.sets.length ? last.item.sets.length : 3;
  return { exercise: id, note: '', sets: Array.from({ length: n }, emptySet) };
}
const emptySet = () => ({ weight: null, reps: null, plus: false, done: false });
// Placeholder for set j: last time's set j, or last time's final set if there were fewer.
function placeholder(st, id, j) {
  const sets = st[id] ? st[id].item.sets : [];
  return sets.length ? sets[Math.min(j, sets.length - 1)] : null;
}

// ================= Photos =================
// One photo per exercise. The blob lives in IndexedDB (and in Drive, see the Drive section);
// gym.json only stores its file name in exercises[].photo. A new name is used for every
// replacement, so other devices notice the change.
const Photos = (() => {
  let dbp, io;
  const urls = {}, misses = {};
  const db = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('gym-photos', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('photos');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
  const tx = async (mode, fn) => {
    const store = (await db()).transaction('photos', mode).objectStore('photos');
    return new Promise((res, rej) => { const r = fn(store); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  };
  const get = name => tx('readonly', s => s.get(name));
  const put = (name, blob) => tx('readwrite', s => s.put(blob, name));
  const del = name => { if (urls[name]) { URL.revokeObjectURL(urls[name]); delete urls[name]; } return tx('readwrite', s => s.delete(name)); };
  // Object URL for a photo: from IndexedDB, else downloaded from Drive. null if unavailable.
  async function url(name) {
    if (urls[name]) return urls[name];
    if (misses[name] > Date.now() - 60000) return null;
    let blob = await get(name).catch(() => null);
    if (!blob && (blob = await Drive.fetchPhoto(name))) await put(name, blob);
    if (!blob) { misses[name] = Date.now(); return null; }
    return (urls[name] = URL.createObjectURL(blob));
  }
  // Fills every <img data-photo> under root once it scrolls into view.
  function hydrate(root) {
    if (io) io.disconnect();
    io = new IntersectionObserver(entries => entries.forEach(en => {
      if (!en.isIntersecting) return;
      const img = en.target;
      io.unobserve(img);
      url(img.dataset.photo).then(u => { if (u) img.src = u; else img.classList.add('missing'); });
    }), { rootMargin: '200px' });
    root.querySelectorAll('img[data-photo]').forEach(img => io.observe(img));
  }
  const retry = () => Object.keys(misses).forEach(k => delete misses[k]); // e.g. after a sync
  return { get, put, del, url, hydrate, retry };
})();

// Scales a picked image down to max 1024 px and re-encodes it as JPEG.
async function shrink(file) {
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, 1024 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('encode failed')), 'image/jpeg', 0.8));
}
// Sets (blob) or removes (null) the photo of an exercise. The caller commits.
async function setPhoto(ex, blob) {
  const old = ex.photo;
  if (blob) {
    const name = `${ex.id}-${Date.now().toString(36)}.jpg`;
    await Photos.put(name, blob);
    ex.photo = name;
    Drive.photoAdded(name);
  } else ex.photo = null;
  if (old) { Photos.del(old); Drive.photoRemoved(old); }
}

async function showPhoto(ex) {
  const u = await Photos.url(ex.photo);

  modal(`<img class="full" src="${u}" alt="Photo of ${esc(ex.name)}">

function folded(cur) {

  return [];
}
function toggleFold(cur, id) {
  const ids = folded(cur), k = ids.indexOf(id);
  k < 0 ? ids.push(id) : ids.splice(k, 1);

    it.sets.forEach((s, j) => {

function finishWorkout() {
  const cur = current();
  for (const it of cur.items) it.sets = it.sets.filter(s => s.done || s.weight != null || s.reps != null);
  cur.items = cur.items.filter(it => it.sets.length);
  if (!cur.items.length) {
    data.sessions.splice(data.sessions.indexOf(cur), 1);
    toast('Nothing logged — workout discarded');
  } else {
    cur.finished = true;
    for (const it of cur.items) for (const s of it.sets) delete s.done;
    toast('Workout saved');
  }
  ui.sel = []; ui.adding = false;
  commit();
  Drive.pushNow();
  window.scrollTo(0, 0);
}

function move(gid, id, dir) {

  [list[a], list[b]] = [list[b], list[a]];
  commit();
}

async function saveForm() {
  const name = $('#f-name').value.trim(), setting = $('#f-setting').value.trim();
  const groups = [...document.querySelectorAll('.chip.on')].map(c => c.dataset.g);
  const maxRaw = $('#f-max').value.trim(), maxSkip = nonNegInt(maxRaw);
  const err = msg => { $('#f-err').textContent = msg; };
  if (!name) return err('Name is required.');
  if (!groups.length) return err('Pick at least one muscle group.');
  if (maxRaw && maxSkip === null) return err('Max skip must be a whole number.');
  let ex = ui.form.id ? exById(ui.form.id) : null;
  if (!ex) {
    let id = slugify(name), k = 2;
    while (exById(id)) id = `${slugify(name)}-${k++}`;
    ex = { id, name, setting, maxSkip, archived: false };
    data.exercises.push(ex);
  } else Object.assign(ex, { name, setting, maxSkip });
  for (const g of data.groups) {
    const has = g.exercises.includes(ex.id), want = groups.includes(g.id);
    if (want && !has) g.exercises.push(ex.id);
    if (!want && has) g.exercises.splice(g.exercises.indexOf(ex.id), 1);
  }
  if (ui.form.photo !== undefined) await setPhoto(ex, ui.form.photo);
  ui.form = null;
  commit();
  window.scrollTo(0, ui.listY);
}

function loadStarter() {
  const names = new Set(data.exercises.map(e => e.name.toLowerCase()));
  let added = 0;
  for (const [groups, name, setting] of STARTER) {
    if (names.has(name.toLowerCase())) continue;
    let id = slugify(name), k = 2;
    while (exById(id)) id = `${slugify(name)}-${k++}`;
    data.exercises.push({ id, name, setting, maxSkip: null, archived: false });
    for (const gname of groups.split(', ')) data.groups.find(g => g.name === gname).exercises.push(id);

  }
  if (added) commit();
  toast(added ? `Added ${added} exercises` : 'All starter exercises already exist');

function exportJson() {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([serialize(data)], { type: 'application/json' }));
  a.download = `gym-${today()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
$('#importFile').addEventListener('change', async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  try {
    const raw = JSON.parse(await file.text());
    if (!isObj(raw) || (raw.format && raw.format !== 'gym-tracker')) throw new Error('not a gym-tracker file');
    ui.importPending = { name: file.name, raw, data: normalize(raw) };
    render();
  } catch (err) { toast(`Import failed: ${err.message}`); }
});

// Photo picked (camera or gallery): for the open form, or directly for an exercise.
$('#photoFile').addEventListener('change', async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  let blob;
  try { blob = await shrink(file); } catch { return toast('Could not read that image'); }
  const ex = ui.photoTarget && exById(ui.photoTarget);
  if (ex) {
    await setPhoto(ex, blob);
    modal(null);
    commit();
    toast('Photo saved');
  } else if (ui.form) { ui.form.photo = blob; renderFormPhoto(); }
});

// ---------- Events ----------
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const act = el.dataset.act, cur = current();
  const item = el.dataset.i != null && cur ? cur.items[+el.dataset.i] : null;
  const set = item && el.dataset.j != null ? item.sets[+el.dataset.j] : null;
  switch (act) {
    case 'tab':
      ui.tab = el.dataset.tab;
      if (ui.tab !== 'settings') ui.importPending = null;
      render(); window.scrollTo(0, 0); break;
    case 'sync-tap': Drive.tap(); break;
    case 'hist-ex': ui.histEx = el.dataset.id; ui.histN = 30; render(); window.scrollTo(0, 0); break;
    case 'hist-more': ui.histN += 30; render(); break;
    case 'toggle': {
      const id = el.dataset.id, k = ui.sel.indexOf(id);
      k < 0 ? ui.sel.push(id) : ui.sel.splice(k, 1);
      render(); break;
    }
    case 'start':
      data.sessions.push({ id: newSessionId(today()), date: today(), finished: false, items: ui.sel.map(id => newItem(id, stats())) });
      sortSessions(data.sessions);
      ui.sel = [];
      commit(); window.scrollTo(0, 0); break;
    case 'add-ex': ui.adding = true; ui.sel = []; render(); window.scrollTo(0, 0); break;
    case 'add-cancel': ui.adding = false; ui.sel = []; render(); break;
    case 'add-confirm': {
      const st = stats();
      cur.items.push(...ui.sel.map(id => newItem(id, st)));
      ui.adding = false; ui.sel = [];
      commit(); break;
    }
    case 'fold': toggleFold(cur, item.exercise); render(); break;
    case 'rm-item': cur.items.splice(+el.dataset.i, 1); commit(); break;
    case 'move-item': {
      const a = +el.dataset.i, b = a + +el.dataset.dir;
      [cur.items[a], cur.items[b]] = [cur.items[b], cur.items[a]];
      commit();
      document.querySelectorAll('.card')[b].scrollIntoView({ block: 'nearest' }); // keep the moved card in view
      break;
    }
    case 'add-set': item.sets.push(emptySet()); commit(); break;
    case 'rm-set': item.sets.pop(); commit(); break;
    case 'plus': set.plus = !set.plus; commit(); break;
    case 'done':
      if (set.done) set.done = false;
      else {
        const ph = placeholder(stats(), item.exercise, +el.dataset.j);
        if (ph && set.weight == null) set.weight = ph.weight;
        if (ph && set.reps == null) set.reps = ph.reps;
        set.done = true;
      }
      commit(); break;
    case 'finish': finishWorkout(); break;
    case 'discard':
      if (!confirmTap(el, 'Tap again to discard')) break;
      data.sessions.splice(data.sessions.indexOf(cur), 1);
      ui.adding = false; ui.sel = [];
      commit(); toast('Workout discarded'); break;
    case 'starter': loadStarter(); break;
    case 'new-ex': ui.listY = window.scrollY; ui.form = { id: null }; render(); window.scrollTo(0, 0); break;
    case 'edit-ex': ui.listY = window.scrollY; ui.form = { id: el.dataset.id }; render(); window.scrollTo(0, 0); break;
    case 'move': move(el.dataset.g, el.dataset.id, +el.dataset.dir); break;
    case 'chip': el.classList.toggle('on'); el.setAttribute('aria-pressed', el.classList.contains('on')); break;
    case 'form-cancel': ui.form = null; render(); window.scrollTo(0, ui.listY); break;
    case 'form-save': saveForm(); break;
    case 'form-archive': {
      const ex = exById(ui.form.id);
      ex.archived = !ex.archived;
      ui.sel = ui.sel.filter(id => id !== ex.id);
      toast(ex.archived ? `Archived ${ex.name}` : `Restored ${ex.name}`);
      ui.form = null; commit(); window.scrollTo(0, ui.listY); break;
    }
    case 'export': exportJson(); break;
    case 'import': $('#importFile').click(); break;
    case 'import-cancel': ui.importPending = null; render(); break;
    case 'import-confirm': {
      const raw = ui.importPending.raw;
      ui.importPending = null; ui.sel = []; ui.adding = false;
      replaceData(raw, true);
      toast('Data imported');
      Drive.pushNow(); break;
    }
    case 'drive-connect': Drive.connect(); break;
    case 'drive-sync': Drive.tap(); break;
    case 'drive-disconnect': Drive.disconnect(); break;
    case 'photo-pick': ui.photoTarget = el.dataset.id || null; $('#photoFile').click(); break;
    case 'photo-clear': ui.form.photo = null; renderFormPhoto(); break;
    case 'view-photo': showPhoto(exById(el.dataset.id)); break;
    case 'modal-close': modal(null); break;
    case 'conflict-local': Drive.resolveConflict(true); break;
    case 'conflict-remote': Drive.resolveConflict(false); break;
  }
});

// Workout fields autosave on every keystroke without re-rendering (keeps focus).
function onField(e) {
  const t = e.target, f = t.dataset.f, cur = current();
  if (!f || !cur) return;
  if (f === 'date') {
    if (!validDate(t.value) || t.value === cur.date) return;
    cur.date = t.value; sortSessions(data.sessions);
    return commit({ render: false });
  }
  const item = cur.items[+t.dataset.i];
  if (f === 'setting') { const ex = exById(item.exercise); if (ex) ex.setting = t.value; }
  else if (f === 'note') { item.note = t.value; autoGrow(t); }
  else {
    const s = item.sets[+t.dataset.j];
    s[f] = f === 'weight' ? num(t.value) : int(t.value);
    s.done = s.weight != null || s.reps != null; // typing a value marks the row as done
    const row = t.closest('.set');
    row.classList.toggle('done', s.done);
    row.querySelector('.tog.ok').classList.toggle('on', s.done);
  }
  commit({ render: false });
}
document.addEventListener('input', onField);
document.addEventListener('change', e => {
  if (e.target.dataset.f === 'date') onField(e);
  if (e.target.id === 'hist-ex') { ui.histEx = e.target.value; ui.histN = 30; render(); window.scrollTo(0, 0); }
});
document.addEventListener('toggle', e => { if (e.target.dataset.actToggle === 'arch') ui.archOpen = e.target.open; }, true);

// ================= Google Drive sync =================
// Self-contained. Interface used by the app: Drive.status, Drive.connect(), Drive.pull(), Drive.push(),
// Drive.sync(), Drive.tap(), Drive.schedulePush(), Drive.pushNow(), Drive.disconnect(), Drive.info(),
// and for photos Drive.photoAdded(name), Drive.photoRemoved(name), Drive.fetchPhoto(name).
// Depends on the app only through: data, serialize(), replaceData(), isDirty(), setDirty(), changeSeq,
// today(), render(), toast(), modal(), Photos.get(), Photos.retry().
// Photos are separate files in "Gym Tracker/photos". New photos are uploaded before gym.json is written
// (so it never names a missing file); replaced or removed ones are moved to the Drive trash after.
const Drive = (() => {
  const SCOPE = 'https://www.googleapis.com/auth/drive.file';
  const API = 'https://www.googleapis.com/drive/v3', UPLOAD = 'https://www.googleapis.com/upload/drive/v3';
  const FOLDER = 'Gym Tracker', FILE = 'gym.json';
  const K = {
    token: 'gym.drive.token', expires: 'gym.drive.expires', consented: 'gym.drive.consented',
    connected: 'gym.drive.connected', folder: 'gym.drive.folderId', file: 'gym.drive.fileId',
    mtime: 'gym.drive.modifiedTime', backup: 'gym.drive.backupDay',
    lastSync: 'gym.drive.lastSync', lastError: 'gym.drive.lastError',
    photosFolder: 'gym.drive.photosFolderId', photoQueue: 'gym.drive.photoQueue',
  };
  const FOLDER_MIME = 'application/vnd.google-apps.folder';
  const quote = s => `'${s.replace(/\\/g, '\\\\').replace(/'/g, "\\'")}'`; // Drive query string literal
  const get = k => localStorage.getItem(k);
  const put = (k, v) => v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v);
  const configured = !!GOOGLE_CLIENT_ID && !GOOGLE_CLIENT_ID.startsWith('YOUR_');
  let tokenClient = null, authWaiter = null, busy = false, timer = null, conflict = null;

  const hasToken = () => !!get(K.token) && Number(get(K.expires)) > Date.now() + 30000;
  const connected = () => configured && get(K.connected) === '1';
  function status() {
    if (!connected()) return 'local';
    if (busy) return 'syncing';
    if (!hasToken() || get(K.lastError) || conflict) return 'reconnect';
    return isDirty() ? 'unsynced' : 'synced';
  }
  const update = () => (ui.tab === 'settings' ? render() : renderChrome());

  // --- Auth (GIS token model). The script is preloaded so the popup opens inside the click. ---
  function loadGis() {
    if (!configured) return;
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
    s.onload = () => {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_CLIENT_ID, scope: SCOPE, callback: onToken,
        error_callback: err => finishAuth(new Error(err && (err.message || err.type) || 'Sign-in cancelled')),
      });
    };
    document.head.appendChild(s);
  }
  function onToken(r) {
    if (r.error) return finishAuth(new Error(r.error_description || r.error));
    if (!google.accounts.oauth2.hasGrantedAllScopes(r, SCOPE)) return finishAuth(new Error('Drive access was not granted'));
    put(K.token, r.access_token);
    put(K.expires, String(Date.now() + Number(r.expires_in || 3600) * 1000));
    put(K.consented, '1');
    finishAuth(null);
  }
  function finishAuth(err) { const w = authWaiter; authWaiter = null; if (w) err ? w.reject(err) : w.resolve(); }
  // Must be called synchronously from a click handler.
  function requestToken() {
    return new Promise((resolve, reject) => {
      if (!tokenClient) return reject(new Error('Google sign-in is not loaded yet. Check the connection and try again.'));
      authWaiter = { resolve, reject };
      tokenClient.requestAccessToken({ prompt: get(K.consented) ? '' : 'consent' });
    });
  }

  // --- REST ---
  async function api(url, opts = {}) {
    const res = await fetch(url, { ...opts, cache: 'no-store', headers: { Authorization: `Bearer ${get(K.token)}`, ...(opts.headers || {}) } });
    if (res.status === 401) { put(K.token, null); throw new Error('Google sign-in expired'); }
    if (!res.ok) { const e = new Error(`Drive error ${res.status}`); e.status = res.status; throw e; }
    return res;
  }
  const json = async (url, opts) => (await api(url, opts)).json();
  const postJson = (url, body, method = 'POST') => json(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  async function findOne(q) {
    const r = await json(`${API}/files?q=${encodeURIComponent(q)}&spaces=drive&pageSize=1&fields=files(id,modifiedTime)`);
    return r.files[0] || null;
  }
  async function getMeta(id, fields) {
    try { const f = await json(`${API}/files/${id}?fields=${fields},trashed`); return f.trashed ? null : f; }
    catch (e) { if (e.status === 404) return null; throw e; }
  }
  async function folderId() {
    let id = get(K.folder);
    if (id && await getMeta(id, 'id')) return id;
    const found = await findOne(`name='${FOLDER}' and mimeType='${FOLDER_MIME}' and 'root' in parents and trashed=false`);
    id = found ? found.id : (await postJson(`${API}/files?fields=id`, { name: FOLDER, mimeType: FOLDER_MIME })).id;
    put(K.folder, id);
    return id;
  }
  // With create = false (read-only lookups) returns null instead of creating the folder.
  async function photosFolderId(create = true) {
    let id = get(K.photosFolder);
    if (id && await getMeta(id, 'id')) return id;
    const parent = await folderId();
    const found = await findOne(`name='photos' and mimeType='${FOLDER_MIME}' and '${parent}' in parents and trashed=false`);
    if (!found && !create) return null;
    id = found ? found.id : (await postJson(`${API}/files?fields=id`, { name: 'photos', mimeType: FOLDER_MIME, parents: [parent] })).id;
    put(K.photosFolder, id);
    return id;
  }
  // Creates a file with content in one multipart request; returns {id, modifiedTime}.
  function createFile(name, parent, type, content) {
    const b = 'gymtracker' + Math.random().toString(36).slice(2);
    const metadata = JSON.stringify({ name, parents: [parent], mimeType: type });
    return json(`${UPLOAD}/files?uploadType=multipart&fields=id,modifiedTime`, {
      method: 'POST', headers: { 'Content-Type': `multipart/related; boundary=${b}` },
      body: new Blob([`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${metadata}\r\n--${b}\r\nContent-Type: ${type}\r\n\r\n`,
        content, `\r\n--${b}--`]),
    });
  }
  // {id, modifiedTime} of gym.json, or null if it does not exist yet.
  async function fileMeta() {
    const id = get(K.file);
    if (id) { const f = await getMeta(id, 'id,modifiedTime'); if (f) return f; put(K.file, null); }
    const f = await findOne(`name='${FILE}' and '${await folderId()}' in parents and trashed=false`);
    if (f) put(K.file, f.id);
    return f;
  }
  async function takeRemote(meta) {
    const text = await (await api(`${API}/files/${meta.id}?alt=media`)).text();
    let raw;
    try { raw = JSON.parse(text); } catch { throw new Error('gym.json on Drive is not valid JSON — fix it by hand'); }
    put(K.mtime, meta.modifiedTime);
    replaceData(raw, false);
  }
  // Copies gym.json to gym-backup-YYYY-MM-DD.json before the first overwrite of the day.
  async function backup(fileId) {
    const day = today(), name = `gym-backup-${day}.json`;
    if (get(K.backup) === day) return;
    const folder = await folderId();
    if (!await findOne(`name='${name}' and '${folder}' in parents and trashed=false`))
      await postJson(`${API}/files/${fileId}/copy?fields=id`, { name, parents: [folder] });
    put(K.backup, day);
  }
  async function write(meta) {
    const seq = changeSeq, body = serialize(data);
    let res;
    if (meta) {
      await backup(meta.id);
      res = await json(`${UPLOAD}/files/${meta.id}?uploadType=media&fields=id,modifiedTime`,
        { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body });
    } else {
      res = await createFile(FILE, await folderId(), 'application/json', body);
      put(K.file, res.id);
    }
    put(K.mtime, res.modifiedTime);
    if (changeSeq === seq) setDirty(false);
  }

  // --- Photos ---
  function queue() {
    try { const q = JSON.parse(get(K.photoQueue)); return { up: arr(q.up), trash: arr(q.trash) }; }
    catch { return { up: [], trash: [] }; }
  }
  function editQueue(fn) { const q = queue(); fn(q); put(K.photoQueue, JSON.stringify(q)); }
  function photoAdded(name) { editQueue(q => q.up.push(name)); }
  function photoRemoved(name) {
    editQueue(q => { if (q.up.includes(name)) q.up = q.up.filter(n => n !== name); else q.trash.push(name); });
  }
  async function findPhoto(name, create = true) {
    const folder = await photosFolderId(create);
    return folder && findOne(`name=${quote(name)} and '${folder}' in parents and trashed=false`);
  }
  async function uploadPhotos() {
    const used = new Set(data.exercises.map(e => e.photo));
    for (const name of queue().up) {
      const blob = used.has(name) && await Photos.get(name);
      if (blob && !await findPhoto(name)) await createFile(name, await photosFolderId(), 'image/jpeg', blob);
      editQueue(q => { q.up = q.up.filter(n => n !== name); });
    }
  }
  async function trashPhotos() {
    for (const name of queue().trash) {
      const f = await findPhoto(name);
      if (f) await postJson(`${API}/files/${f.id}?fields=id`, { trashed: true }, 'PATCH');
      editQueue(q => { q.trash = q.trash.filter(n => n !== name); });
    }
  }
  // Downloads a photo that is not on this device yet. null if offline, not connected or not found.
  async function fetchPhoto(name) {
    if (!connected() || !hasToken() || !get(K.file)) return null; // only after a first sync found gym.json
    try {
      const f = await findPhoto(name, false);
      return f ? await (await api(`${API}/files/${f.id}?alt=media`)).blob() : null;
    } catch (e) { console.error(e); return null; }
  }

  // --- Sync steps. Each returns false if it stopped on a conflict. ---
  async function pull() {
    const meta = await fileMeta();
    if (!meta || meta.modifiedTime === get(K.mtime)) return true;
    if (!isDirty()) { await takeRemote(meta); return true; }
    askConflict(meta); return false;
  }
  async function push() {
    const meta = await fileMeta();
    if (meta && meta.modifiedTime !== get(K.mtime)) {
      if (!isDirty()) { await takeRemote(meta); return true; }
      askConflict(meta); return false;
    }
    await uploadPhotos();
    await write(meta);
    await trashPhotos();
    return true;
  }
  async function syncSteps() { if (!await pull()) return false; return isDirty() ? push() : true; }

  async function run(fn) {
    if (busy || conflict || !connected() || !hasToken()) return update();
    busy = true; update();
    try {
      if (await fn() !== false) put(K.lastSync, new Date().toISOString());
      put(K.lastError, null);
      Photos.retry();
    } catch (e) {
      console.error(e);
      put(K.lastError, e.message || String(e));
    } finally {
      busy = false; update();
    }
    if (isDirty() && !get(K.lastError) && !conflict) schedulePush();
  }

  // --- Conflict: the file changed on Drive and this device has unsynced changes. ---
  function askConflict(meta) { conflict = meta; showConflict(); }
  function showConflict() {
    modal(`<h2>Drive copy changed</h2>
      <p>gym.json was changed elsewhere since this device last synced, and this device has unsynced changes too.</p>
      <button class="btn block primary" data-act="conflict-local">Keep this device's version</button>
      <button class="btn block" data-act="conflict-remote">Use Drive version</button>`);
  }
  function resolveConflict(useLocal) {
    const meta = conflict;
    conflict = null; modal(null);
    if (!meta) return;
    run(async () => {
      if (!useLocal) return takeRemote(meta);
      put(K.mtime, meta.modifiedTime); // accept their version as the base, then overwrite it
      return push();
    });
  }

  // --- Public ---
  function schedulePush() {
    clearTimeout(timer);
    if (connected() && hasToken() && !conflict) timer = setTimeout(() => run(push), 3000);
  }
  function pushNow() { clearTimeout(timer); run(push); }
  const sync = () => run(syncSteps);
  function connect() { // user gesture
    if (!configured) { toast('Google Drive is not configured (see SETUP.md)'); return; }
    requestToken()
      .then(() => { put(K.connected, '1'); put(K.lastError, null); return sync(); })
      .catch(e => { put(K.lastError, e.message); update(); });
  }
  function tap() { // sync indicator / "Sync now": interactive sync
    if (!connected()) { ui.tab = 'settings'; render(); if (configured) connect(); return; }
    if (conflict) return showConflict();
    put(K.lastError, null);
    hasToken() ? sync() : connect();
  }
  function disconnect() {
    const t = get(K.token);
    if (t && window.google && google.accounts) google.accounts.oauth2.revoke(t, () => {});
    [K.token, K.expires, K.connected, K.consented, K.lastError].forEach(k => put(k, null));
    clearTimeout(timer);
    update();
  }
  function init() {
    loadGis();
    if (connected() && hasToken()) sync();
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') { if (connected() && hasToken()) sync(); else update(); }
    });
  }
  const info = () => ({
    configured, connected: connected(), hasToken: hasToken(),
    lastSync: get(K.lastSync), lastError: get(K.lastError),
  });
  return {
    get status() { return status(); },
    connect, pull: () => run(pull), push: () => run(push), sync, tap, schedulePush, pushNow,
    disconnect, resolveConflict, info, init, photoAdded, photoRemoved, fetchPhoto,
  };
})();

// ================= Start =================
render();
Drive.init();
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js');
</script>
